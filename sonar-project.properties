# La organization key y la project key se pasan desde el pipeline, como
# variables de repositorio:
#   sonar.organization -> SONAR_ORG
#   sonar.projectKey   -> SONAR_PROJECT_KEY
# Ver .github/workflows/pipeline.yml, paso "Analisis de calidad".

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
